<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Connexion | Groupe de recherche Zabantu{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zabantu-primary: #6f826a;
            --zabantu-secondary: #bf9264;
            --zabantu-accent: #bbd8a3;
            --zabantu-dark: #2c3e2c;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #fff;
        }

        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Section Gauche : Logo & Slogan centrés */
        .brand-section {
            flex: 1;
            background: linear-gradient(135deg, var(--zabantu-dark) 0%, #3d523d 100%);
            color: white;
            display: flex;
            align-items: center; /* Centrage vertical */
            justify-content: center; /* Centrage horizontal */
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .brand-section::before {
            content: "";
            position: absolute;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: var(--zabantu-primary);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
        }

        .logo-img {
            width: 190px; /* Logo plus grand car central */
            height: auto;
            background: #fff;
            padding: 10px;
            border-radius: 20px;
            border: 3px solid var(--zabantu-accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .brand-logo-text {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 5px;
            color: var(--zabantu-accent);
            margin-bottom: 1rem;
            display: block;
            text-transform: uppercase;
        }

        .brand-slogan {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin: 0;
            text-transform: uppercase;
        }

        /* Section Droite : Formulaire */
        .form-section {
            width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            background: white;
            border-left: 1px solid #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }

        .form-title {
            font-weight: 700;
            color: var(--zabantu-dark);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--zabantu-dark);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--zabantu-primary);
            box-shadow: 0 0 0 4px rgba(111, 130, 106, 0.1);
            outline: none;
        }

        .btn-zabantu {
            background-color: var(--zabantu-dark);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-zabantu:hover {
            background-color: var(--zabantu-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .back-link {
            margin-top: 3rem;
            text-align: center;
        }

        .back-link a {
            color: var(--zabantu-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .error-alert {
            background: #fff1f2;
            color: #be123c;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ffe4e6;
        }

        .form-control { min-height: 48px; }
        .form-control:focus-visible, .btn-zabantu:focus-visible, .pw-toggle:focus-visible, a:focus-visible { outline: 3px solid rgba(111,130,106,.55); outline-offset: 2px; }
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 3rem; }
        .pw-toggle { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none; color: #64748b; border-radius: 8px; }
        .forgot-link { display: block; text-align: right; margin-top: .5rem; font-size: .85rem; color: var(--zabantu-primary); text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }
        .notice { padding: .8rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1.25rem; }
        .notice-success { background: #ecfdf3; color: #166534; border: 1px solid #bbf7d0; }
        .notice-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .join-card { margin-top: 2rem; padding: 1.1rem 1.25rem; border: 1.5px dashed #cfd5c6; border-radius: 12px; text-align: center; background: #f8f9f4; }
        .join-card p { margin: 0 0 .6rem; font-size: .9rem; color: #475569; }
        .join-card a { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: 0 1.25rem; border-radius: 10px; background: var(--zabantu-secondary); color: #fff; font-weight: 600; text-decoration: none; font-size: .92rem; }
        .join-card a:hover { background: var(--zabantu-dark); }
        .state-icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem; }
        .state-success { background: #ecfdf3; color: #166534; }
        .state-info { background: rgba(111,130,106,.14); color: var(--zabantu-dark); }
        .state-error { background: #fff1f2; color: #be123c; }
        .hint-list { padding-left: 1.2rem; color: #475569; font-size: .9rem; margin-bottom: 1.5rem; line-height: 1.6; }
        .hint-list a { color: var(--zabantu-primary); font-weight: 600; }
        .form-help { font-size: .8rem; color: #64748b; margin-top: .5rem; }
        .form-help ul { padding-left: 1.1rem; margin: 0; }
        .mobile-brand { display: none; text-align: center; margin-bottom: 1.5rem; }
        .mobile-brand img { width: 130px; height: auto; }
        @media (max-width: 992px) {
            .brand-section { display: none; }
            .mobile-brand { display: block; }
            .form-section { width: 100%; padding: 2rem; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="brand-section">
        <div class="brand-content">
            <img src="/static/site_web/images/zabantu_logo.jpg" alt="Zabantu Logo" class="logo-img">
            <span class="brand-logo-text">Zabantu</span>
            <h1 class="brand-slogan">Economy | Conflict | State</h1>
        </div>
    </div>

    <div class="form-section">
        <div class="login-card">
{% block card %}{% endblock %}
            <div class="back-link">
                <a href="{% url 'home' %}">
                    <i class="fas fa-arrow-left me-2"></i> Retour au site public
                </a>
            </div>
        </div>
    </div>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
