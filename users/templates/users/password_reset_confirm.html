<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - Zabantu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
        }
        
        .card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 3rem 2.5rem;
        }
        
        .title {
            color: white;
            font-weight: 700;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        .form-text {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            font-size: 1rem;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        
        .alert-heading {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #f87171;
        }
        
        .alert-link {
            color: #93c5fd;
            text-decoration: none;
        }
        
        .alert-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 576px) {
            .card {
                padding: 2rem 1.5rem;
            }
            
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1 class="title">Choisir un nouveau mot de passe</h1>
            
            {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_new_password1" class="form-label">Nouveau mot de passe</label>
                        <input type="password" name="new_password1" class="form-input" 
                               id="id_new_password1" required autocomplete="new-password">
                        <div class="form-text">
                            Votre mot de passe doit contenir au moins 8 caractères.
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="id_new_password2" class="form-label">Confirmation du mot de passe</label>
                        <input type="password" name="new_password2" class="form-input" 
                               id="id_new_password2" required autocomplete="new-password">
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-key me-2"></i>Réinitialiser le mot de passe
                    </button>
                </form>
            {% else %}
                <div class="alert alert-danger">
                    <h4 class="alert-heading">Lien invalide</h4>
                    <p>Ce lien de réinitialisation a déjà été utilisé ou a expiré.</p>
                    <p class="mb-0">
                        <a href="{% url 'password_reset' %}" class="alert-link">
                            Demander un nouveau lien
                        </a>
                    </p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
