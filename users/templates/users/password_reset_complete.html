{% extends 'users/auth_base.html' %}

{% block title %}Mot de passe modifié | Groupe de recherche Zabantu{% endblock %}

{% block card %}
            <div class="mobile-brand"><img src="/static/site_web/images/zabantu_logo.jpg" alt="Zabantu"></div>
            <div class="state-icon state-success"><i class="fas fa-circle-check"></i></div>
            <h2 class="form-title">Mot de passe modifié</h2>
            <p class="form-subtitle">Votre mot de passe a été changé avec succès. Vous pouvez maintenant vous connecter.</p>
            <a href="{% url 'login' %}" class="btn-zabantu" style="text-decoration:none;">
                <span>Se connecter</span>
                <i class="fas fa-sign-in-alt"></i>
            </a>
{% endblock %}
