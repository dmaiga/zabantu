<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Collectif Zabantu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zabantu-primary: #6f826a;
            --zabantu-secondary: #bf9264;
            --zabantu-accent: #bbd8a3;
            --zabantu-dark: #2c3e2c;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #fff;
        }

        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Section Gauche : Logo & Slogan centrés */
        .brand-section {
            flex: 1;
            background: linear-gradient(135deg, var(--zabantu-dark) 0%, #3d523d 100%);
            color: white;
            display: flex;
            align-items: center; /* Centrage vertical */
            justify-content: center; /* Centrage horizontal */
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .brand-section::before {
            content: "";
            position: absolute;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: var(--zabantu-primary);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
        }

        .logo-img {
            width: 150px; /* Logo plus grand car central */
            height: 150px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--zabantu-accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .brand-logo-text {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 5px;
            color: var(--zabantu-accent);
            margin-bottom: 1rem;
            display: block;
            text-transform: uppercase;
        }

        .brand-slogan {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin: 0;
            text-transform: uppercase;
        }

        /* Section Droite : Formulaire */
        .form-section {
            width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            background: white;
            border-left: 1px solid #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }

        .form-title {
            font-weight: 700;
            color: var(--zabantu-dark);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--zabantu-dark);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--zabantu-primary);
            box-shadow: 0 0 0 4px rgba(111, 130, 106, 0.1);
            outline: none;
        }

        .btn-zabantu {
            background-color: var(--zabantu-dark);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-zabantu:hover {
            background-color: var(--zabantu-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .back-link {
            margin-top: 3rem;
            text-align: center;
        }

        .back-link a {
            color: var(--zabantu-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .error-alert {
            background: #fff1f2;
            color: #be123c;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ffe4e6;
        }

        @media (max-width: 992px) {
            .brand-section { display: none; }
            .form-section { width: 100%; padding: 2rem; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="brand-section">
        <div class="brand-content">
            <img src="/static/site_web/images/zabantu_logo.jpg" alt="Zabantu Logo" class="logo-img">
            <span class="brand-logo-text">Zabantu</span>
            <h1 class="brand-slogan">Economy | Conflict | State</h1>
        </div>
    </div>

    <div class="form-section">
        <div class="login-card">
            <h2 class="form-title">Espace Admin</h2>
            <p class="form-subtitle">Connectez-vous pour gérer le collectif.</p>

            {% if form.errors %}
            <div class="error-alert">
                <i class="fas fa-exclamation-triangle me-2"></i> Identifiants incorrects.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label-custom">NOM D'UTILISATEUR</label>
                    <input type="text" name="username" class="form-control" placeholder="Utilisateur" required autofocus>
                </div>
                
                <div class="mb-3">
                    <label class="form-label-custom">MOT DE PASSE</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-zabantu">
                    <span>Accéder à l'admin</span>
                    <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <div class="back-link">
                <a href="{% url 'home' %}">
                    <i class="fas fa-arrow-left me-2"></i> Retour au site public
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
