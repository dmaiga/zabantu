{# Action qui modifie des données : toujours un POST (jamais un lien). Paramètres : url, label (vide = icône seule), title, btn_class, icon, confirm #}
<form method="post" action="{{ url }}" class="d-inline" onsubmit="var b=this.querySelector('button'); b.disabled=true; b.innerHTML='<span class=&quot;spinner-border spinner-border-sm me-1&quot;></span>En cours…';">
    {% csrf_token %}
    <button type="submit" class="btn {{ btn_class }}" title="{{ title|default:label }}" aria-label="{{ title|default:label }}"{% if confirm %} onclick="return confirm('{{ confirm|escapejs }}')"{% endif %}>
        {% if icon %}<i class="fas {{ icon }}"></i> {% endif %}{{ label }}
    </button>
</form>
