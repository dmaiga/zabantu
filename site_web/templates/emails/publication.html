{% extends 'emails/base_email.html' %}
{% block title %}{{ label }} : {{ title }}{% endblock %}
{% block heading %}{{ label }}{% endblock %}
{% block body %}
<h2 style="margin:0 0 20px; color:#2c3e2c; border-bottom:2px solid #bbd8a3; padding-bottom:10px;">{{ title }}</h2>
{% if excerpt %}<p style="margin:0 0 24px; padding:16px; background:#f0f1c5; border-radius:6px;">{{ excerpt }}</p>{% endif %}
<p style="text-align:center; margin:30px 0;">
    <a href="{{ url }}" style="display:inline-block; background:#bf9264; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:30px; font-weight:bold;">Lire la suite</a>
</p>
<p style="margin:0;">{{ closing }}</p>
{% endblock %}
