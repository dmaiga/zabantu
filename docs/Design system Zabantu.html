  <title>Styleguide Zabantu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Styleguide Zabantu...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:#28382d;font-weight:700}\n.step.act .dot{background:#28382d;border-color:#28382d;color:#fff}\n.step.done{color:#3e6b24}\n.step.done .dot{background:#3e6b24;border-color:#3e6b24;color:#fff}\n.step.done+.step::after{border-top-color:#3e6b24}\n.step.err{color:#7a1a14;font-weight:700}\n.step.err .dot{background:#b3261e;border-color:#b3261e;color:#fff}\n\n/* alerts */\n.al{display:flex;gap:0.75rem;align-items:flex-start;padding:0.75rem 1rem;border:1px solid;border-left-width:4px;border-radius:12px}\n.al .ic{margin-top:3px}\n.al-ok{color:#2c4d19;background:#e8f5e0;border-color:#3e6b24}\n.al-info{color:#114255;background:#ddf0f8;border-color:#0e5e83}\n.al-warn{color:#624a04;background:#fdf4d8;border-color:#896806}\n.al-err{color:#7a1a14;background:#fdecea;border-color:#b3261e}\n\n/* pagination */\n.pg{display:flex;flex-wrap:wrap;gap:0.25rem;list-style:none;margin:0;padding:0}\n.pg a,.pg span{min-width:2.75rem;min-height:2.75rem;display:inline-flex;align-items:center;justify-content:center;padding:0 0.75rem;border:1px solid #d1d7d0;border-radius:6px;background:#fff;color:#3e6b24;font-weight:600;text-decoration:none}\n.pg a:hover{background:#f1f5ec;border-color:#3e6b24}\n.pg .on{background:#3e6b24;border-color:#3e6b24;color:#fff}\n.pg .off{background:#eaece9;color:#576354}\n\n/* empty + thanks */\n.empty{text-align:center;padding:3rem 1rem;background:#fff;border:1px dashed #6d7c6a;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:0.75rem}\n.empty .ic{width:2.5rem;height:2.5rem;color:#576354}\n.thanks{border:1px solid #3e6b24;background:#e8f5e0}\n.thanks .ic{color:#3e6b24}\n\n/* member + social + gallery */\n.member{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.5rem}\n.avatar{width:128px;height:128px;border-radius:999px;background:#eaece9;border:3px solid #fff;box-shadow:0 1px 2px rgba(31,36,30,.08),0 1px 3px rgba(31,36,30,.06);display:grid;place-items:center;font-family:\"Source Serif 4\",Georgia,\"Times New Roman\",serif;font-size:2.5rem;font-weight:700;color:#28382d;background:linear-gradient(135deg,#cee9be,#a0d1f1)}\n.social{display:flex;gap:0.25rem;list-style:none;margin:0;padding:0}\n.social a{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:999px;color:#3e6b24}\n.social a:hover{background:#f1f5ec}\n.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.5rem}\n@media (min-width:768px){.gal{grid-template-columns:repeat(4,minmax(0,1fr));gap:0.75rem} }\n.gal a{display:block;position:relative;aspect-ratio:4 / 3;border-radius:6px;overflow:hidden;background:#eaece9}\n\n/* footer */\n.ft{background:#28382d;color:#e8f5e0;padding:3rem 1.5rem 1.5rem;border-radius:12px}\n.ft h4{color:#fff;margin-bottom:0.75rem}\n.ft a{color:#fff}\n.ft a:hover{color:#f6c42c}\n.ft ul{list-style:none;margin:0;padding:0}\n.ft li a{display:inline-flex;align-items:center;min-height:2.75rem}\n.ft .legal{border-top:1px solid #2c4d19;margin-top:2rem;padding-top:1rem;font-size:0.875rem}\n.ft .social a{color:#fff}\n.ft .social a:hover{background:#2c4d19;color:#f6c42c}\n.ft .fc{border-color:#e8f5e0}\n\n/* logo rules */\n.logo-tile{border:1px solid #d1d7d0;border-radius:12px;overflow:hidden;background:#fff}\n.logo-tile .stage{display:grid;place-items:center;padding:1.5rem;min-height:170px}\n.logo-tile .cap{padding:0.75rem 1rem;border-top:1px solid #d1d7d0;font-size:0.875rem;color:#444d42}\n.logo-tile img{display:block;max-width:100%;height:auto}\n.dos{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}\n.dos ul{margin:0.75rem 0 0;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.5rem}\n.do{border-top:4px solid #3e6b24}\n.dont{border-top:4px solid #b3261e}\n.skip{position:static;display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1rem;background:#28382d;color:#fff;border-radius:6px;font-weight:600;text-decoration:none}\n\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important} }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n<symbol id=\"i-check\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-info\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v6M12 7.5v.01\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-warn\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 3.5l9.5 16.5h-19z\"><\u002Fpath><path d=\"M12 10v4.5M12 17.5v.01\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-x\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9 9l6 6M15 9l-6 6\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-search\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M16 16l4.5 4.5\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-upload\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 16V4M7 9l5-5 5 5M4 17v3h16v-3\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-menu\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-down\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-cal\" sc-camel-view-box=\"0 0 24 24\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14.5\" rx=\"2\"><\u002Frect><path d=\"M4 10h16M8.5 3.5v4M15.5 3.5v4\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-user\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"8.5\" r=\"3.5\"><\u002Fcircle><path d=\"M5 20c.8-3.8 3.6-5.5 7-5.5s6.2 1.7 7 5.5\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-book\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M4 5.5c3-1 5.5-.8 8 1 2.5-1.8 5-2 8-1V19c-3-1-5.5-.8-8 1-2.5-1.8-5-2-8-1z\"><\u002Fpath><path d=\"M12 6.5V20\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-mail\" sc-camel-view-box=\"0 0 24 24\"><rect x=\"3.5\" y=\"5.5\" width=\"17\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M4 7l8 6 8-6\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-link\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"i-pin\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 21s6.5-6 6.5-11a6.5 6.5 0 10-13 0c0 5 6.5 11 6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.3\"><\u002Fcircle><\u002Fsymbol>\n<symbol id=\"i-arrow\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsymbol>\n<\u002Fsvg>\n\n<header class=\"hero dark\">\n<div class=\"wrap hero-grid\">\n<div class=\"hero-logo\"><img src=\"5a105841-2464-4c6b-8181-9084629d2d47\" alt=\"Logo du groupe de recherche Zabantu : lettres en lianes vertes, livre ouvert bleu, loupe, Economy / Conflict / State\"><\u002Fdiv>\n<div style=\"flex:1;min-width:280px\">\n<span class=\"sg-n\" style=\"color:#e8f5e0\">Design system v1.0 · Bootstrap 5.3 · mobile d'abord<\u002Fspan>\n<h1>Groupe de recherche Zabantu<\u002Fh1>\n<p class=\"sg-lead\">Un thème simple, chargé après Bootstrap, qui habille les composants existants sans toucher aux templates Django. Les tokens sont la source unique et se réutilisent tels quels pour une future application mobile.<\u002Fp>\n<div class=\"row\" style=\"margin-top:1.5rem\">\n<a class=\"btn btn-accent\" href=\"#couleurs\">Voir la palette<\u002Fa>\n<a class=\"btn btn-outline\" href=\"#composants\">Voir les composants<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<section class=\"sg-sec\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">Synthèse<\u002Fspan><h2>Les choix principaux en dix lignes<\u002Fh2><\u002Fdiv>\n<div class=\"grid g2\">\n<div class=\"panel\"><div class=\"prose\"><p><b>Palette.<\u002Fb> Le vert profond #28382d porte l'en-tête, le pied de page et les titres. L'action est un vert foncé dérivé de la feuille (#3e6b24, 6,3:1 avec le blanc). Les accents viennent du livre (bleu #1b6d8a), du fruit (orange #a75711) et du jaune #f6c42c, réservé aux fonds avec texte foncé.<\u002Fp>\n<p>Le vert feuille du logo (#92c64b) et le jaune vif ne servent jamais de fond de bouton ni de texte : ils restent du décor.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"panel\"><div class=\"prose\"><p><b>Polices.<\u002Fb> Source Serif 4 pour les titres et le texte éditorial, Source Sans 3 pour l'interface. Même famille de dessin, ton académique sans raideur, et surtout couverture des lettres ɛ et ɔ (« Gɛlɛkan ») dont je n'ai pas pu confirmer la présence dans Inter ; les deux se chargent depuis Google Fonts ou en local.<\u002Fp>\n<p><b>Technique.<\u002Fb> Variables --zb-* pontées vers --bs-*, aucune valeur en dur hors de :root, trois rayons, deux ombres, grille de 4 px, cible tactile de 44 px, focus de 3 px.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec sg-alt\" id=\"couleurs\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">01 · Couleurs<\u002Fspan><h2>Chaque couleur a un nom et un rôle<\u002Fh2>\n<p class=\"sg-lead\">Les valeurs ont été relevées sur le logo (vert feuille #92c64b, bleu clair #a0d1f1, bleu profond #0e5e83, vert des lianes, contours quasi noirs) puis assombries pour l'action et le texte. L'orange et le jaune du fruit sont estimés à l'œil, à confirmer sur le fichier source.<\u002Fp><\u002Fdiv>\n\n<div class=\"sg-sub\" style=\"margin-top:0\">Marque et action<\u002Fdiv>\n<div class=\"grid g4\">\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:#28382d;color:#fff\">Aa<\u002Fdiv><div class=\"sw-i\"><b>brand<\u002Fb><span class=\"mono\">--zb-color-brand · #28382d<\u002Fspan><span class=\"muted\">En-tête, pied de page, titres<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:#3e6b24;color:#fff\">Aa<\u002Fdiv><div class=\"sw-i\"><b>action<\u002Fb><span class=\"mono\">--zb-color-action · #3e6b24<\u002Fspan><span class=\"muted\"> if 4 · Georgia, Times New Roman, serif<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><div class=\"sg-n\">Interface<\u002Fdiv><p style=\"font-size:3rem;font-weight:700;color:#28382d;line-height:1.1;margin-top:0.5rem\">Gɛlɛkan ɔ<\u002Fp><p class=\"muted mono\" style=\"margin-top:0.5rem\">Source Sans 3 · system-ui, Roboto, Arial, sans-serif<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"sg-sub\">Échelle (mobile → bureau, via clamp)<\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">H1 · 30 → 46 px<br>interligne 1,2<\u002Fdiv><div class=\"spec-v\"><h1>Économie politique du Sahel<\u002Fh1><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">H2 · 24 → 34 px<\u002Fdiv><div class=\"spec-v\"><h2>Conflits, États et marchés<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">H3 · 20 → 26 px<\u002Fdiv><div class=\"spec-v\"><h3>Séminaire de recherche mensuel<\u002Fh3><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">H4 · 18 → 20 px<br>titre de carte<\u002Fdiv><div class=\"spec-v\"><h4>Rapport sur la gouvernance foncière à Ségou<\u002Fh4><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">Corps éditorial · 16 → 18 px<br>interligne 1,65 · 68ch<\u002Fdiv><div class=\"spec-v\"><div class=\"prose\"><p>Le groupe réunit des chercheurs en sciences sociales qui travaillent sur l'économie, les conflits et l'État au Mali. Les articles se lisent sur une colonne d'environ soixante-huit caractères, pour que l'œil ne se perde pas d'une ligne à l'autre, y compris sur un téléphone tenu à une main.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">Interface · 16 px<br>interligne 1,5<\u002Fdiv><div class=\"spec-v\">Navigation, boutons, champs, listes<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">Méta · 14 px<\u002Fdiv><div class=\"spec-v\"><span class=\"muted\">12 octobre 2026 · Bamako · 14 pages<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">Étiquette · 13 px<br>capitales, +0,04em<\u002Fdiv><div class=\"spec-v\"><span class=\"sg-n\">Publication<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"spec-k\">Bouton · 16 px, 600<\u002Fdiv><div class=\"spec-v\"><a class=\"btn btn-primary\" href=\"#typo\">Rejoindre Zabantu<\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec sg-alt\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">03 · Espacements, rayons, ombres<\u002Fspan><h2>Une grille de 4 px, trois rayons, deux ombres<\u002Fh2><\u002Fdiv>\n<div class=\"grid g3\">\n<div class=\"panel\"><div class=\"sg-n\" style=\"margin-bottom:0.75rem\">Espacements<\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-1 · 4<\u002Fspan><i style=\"width:4px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-2 · 8<\u002Fspan><i style=\"width:8px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-3 · 12<\u002Fspan><i style=\"width:12px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-4 · 16<\u002Fspan><i style=\"width:16px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-5 · 20<\u002Fspan><i style=\"width:20px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-6 · 24<\u002Fspan><i style=\"width:24px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-8 · 32<\u002Fspan><i style=\"width:32px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-10 · 40<\u002Fspan><i style=\"width:40px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-12 · 48<\u002Fspan><i style=\"width:48px\"><\u002Fi><\u002Fdiv>\n<div class=\"sp\"><span class=\"mono\">space-16 · 64<\u002Fspan><i style=\"width:64px\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n<div class=\"panel\"><div class=\"sg-n\" style=\"margin-bottom:0.75rem\">Rayons<\u002Fdiv>\n<div class=\"row\" style=\"align-items:flex-end\">\n<div style=\"text-align:center\"><div style=\"width:72px;height:72px ass=\"sg-sub\">Assistant en étapes (formulaire d'adhésion)<\u002Fdiv>\n<div class=\"panel\"><ol class=\"stepper\" aria-label=\"Progression de l'adhésion\">\n<li class=\"step done\"><span class=\"dot\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fspan>Identité<\u002Fli>\n<li class=\"step err\"><span class=\"dot\">!<\u002Fspan>Parcours · à corriger<\u002Fli>\n<li class=\"step act\" aria-current=\"step\"><span class=\"dot\">3<\u002Fspan>Motivation<\u002Fli>\n<li class=\"step\"><span class=\"dot\">4<\u002Fspan>Documents<\u002Fli>\n<li class=\"step\"><span class=\"dot\">5<\u002Fspan>Validation<\u002Fli><\u002Fol>\n<p class=\"muted\" style=\"margin-top:1rem\">Visitée : coche et vert action. Active : fond brand, libellé en gras. Erreur : point d'exclamation, libellé précisé. Chaque état change aussi la forme ou le texte, pas seulement la couleur.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">06 · Messages et listes<\u002Fspan><h2>Messages, pagination, tableau, états vides<\u002Fh2><\u002Fdiv>\n<div class=\"grid g2\">\n<div class=\"al al-ok\" role=\"status\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><div><b>Candidature envoyée.<\u002Fb> Nous reviendrons vers vous sous dix jours.<\u002Fdiv><\u002Fdiv>\n<div class=\"al al-info\" role=\"status\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><div><b>Information.<\u002Fb> Les inscriptions au séminaire ferment le 15 novembre.<\u002Fdiv><\u002Fdiv>\n<div class=\"al al-warn\" role=\"alert\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-warn\"><\u002Fuse><\u002Fsvg><div><b>Attention.<\u002Fb> Votre session expire dans cinq minutes.<\u002Fdiv><\u002Fdiv>\n<div class=\"al al-err\" role=\"alert\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg><div><b>Erreur.<\u002Fb> L'envoi a href=\"#composants\">Réinitialiser les filtres<\u002Fa><\u002Fdiv>\n<div class=\"empty thanks\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><h3>Merci, votre demande est envoyée<\u002Fh3><p class=\"muted\" style=\"color:#2c4d19\">Un e-mail de confirmation vient de vous être adressé.<\u002Fp><a class=\"btn btn-primary\" href=\"#composants\">Retour à l'accueil<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec sg-alt\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">07 · Membres, galerie, pied de page<\u002Fspan><h2>Fiche membre, galerie photo, pied de page<\u002Fh2><\u002Fdiv>\n<div class=\"grid g3\">\n<div class=\"panel member\"><div class=\"avatar\" aria-hidden=\"true\">AT<\u002Fdiv><h4 class=\"card-title\">Aminata Traoré<\u002Fh4><span class=\"tag t-mem\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg>Chercheuse associée<\u002Fspan><p class=\"muted\">Économie politique, Université de Bamako<\u002Fp>\n<ul class=\"social\"><li><a href=\"#composants\" aria-label=\"Courriel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-mail\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><li><a href=\"#composants\" aria-label=\"Site personnel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"panel member\"><div class=\"avatar\" aria-hidden=\"true\">MD<\u002Fdiv><h4 class=\"card-title\">Mahamane Diallo<\u002Fh4><span class=\"tag t-mem\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg>Chercheur<\u002Fspan><p class=\"muted\">Conflits et sécurité, Bamako<\u002Fp>\n<ul class=\"social\"><li><a href=\"#composants\" aria-label=\"Courriel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-mail\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><li><a href=\"#composants\" aria-label=\"Site personnel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"panel member\"><div class=\"avatar\" aria-hidden=\"true\">SK<\u002Fdiv><h4 class=\"card-title\">Salif Keïta<\u002Fh4><span class=\"tag t-mem\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg>Doctorant<\u002Fspan><p class=\"muted\">Politiques publiques, Ségou<\u002Fp>\n<ul class=\"social\"><li><a href=\"#composants\" aria-label=\"Courriel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-mail\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><li><a href=\"#composants\" aria-label=\"Site personnel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin-top:0.5rem\">Les noms et profils ci-dessus sont des exemples de mise en forme à remplacer par les vrais membres.<\u002Fp>\n\n<div class=\"sg-sub\">Galerie photo<\u002Fdiv>\n<div class=\"gal\"><a href=\"#composants\" aria-label=\"Photo 1\"><span class=\"ph-img\">Photo 1<\u002Fspan><\u002Fa><a href=\"#composants\" aria-label=\"Photo 2\"><span class=\"ph-img\">Photo 2<\u002Fspan><\u002Fa><a href=\"#composants\" aria-label=\"Photo 3\"><span class=\"ph-img\">Photo 3<\u002Fspan><\u002Fa><a href=\"#composants\" aria-label=\"Photo 4\"><span class=\"ph-img\">Photo 4<\u002Fspan><\u002Fa><\u002Fdiv>\n\n<div class=\"sg-sub\">Pied de page<\u002Fdiv>\n<footer class=\"ft dark\">\n<div class=\"grid g3\" style=\"gap:2rem\">\n<div><h4>Zabantu<\u002Fh4><p>Groupe de recherche en sciences sociales. Economy, Conflict, State. Bamako, Mali.<\u002Fp><ul class=\"social\" style=\"margin-top:0.75rem\"><li><a href=\"#composants\" aria-label=\"LinkedIn\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><li><a href=\"#composants\" aria-label=\"Courriel\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-mail\"><\u002Fuse><\u002Fsvg><\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4>Navigation<\u002Fh4><ul><li><a href=\"#composants\">Publications<\u002Fa><\u002Fli><li><a href=\"#composants\">Séminaires<\u002Fa><\u002Fli><li><a href=\"#composants\">Événements<\u002Fa><\u002Fli><li><a href=\"#composants\">Contact<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4>Infolettre<\u002Fh4><div class=\"fg\"><label class=\"fl\" for=\"nl\" style=\"color:#fff\">Votre adresse e-mail<\u002Flabel><input id=\"nl\" class=\"fc\" placeholder=\"nom@exemple.org\"><\u002Fdiv><button class=\"btn btn-accent\" style=\"margin-top:0.75rem\">S'abonner<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"legal\">© 2026 Groupe de recherche Zabantu · <a href=\"#composants\">Mentions légales<\u002Fa><\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">08 · Accessibilité<\u002Fspan><h2>Règles non négociables<\u002Fh2><\u002Fdiv>\n<div class=\"grid g4\">\n<div class=\"panel\"><b>Focus visible<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">Anneau de 3 px, bleu #0e5e83 sur fond clair, jaune sur fond sombre, décalé de 2 px.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Cibles de 44 px<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">Boutons, liens de navigation, filtres, cases, pagination et icônes cliquables.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Mouvement réduit<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">prefers-reduced-motion coupe toutes les transitions et animations.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Pas de couleur seule<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">Toujours une icône ou un texte avec la couleur : états, types, erreurs, étapes.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"row\" style=\"margin-top:1.5rem\"><a class=\"skip\" href=\"#composants\">Aller au contenu<\u002Fa><span class=\"muted\">Lien d'évitement : caché hors écran, visible au premier appui sur Tab.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec sg-alt\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">09 · Logo<\u002Fspan><h2>Règles d'usage<\u002Fh2>\n<p class=\"sg-lead\">Le fichier fourni est un JPEG à fond blanc : il ne s'utilise que sur fond blanc. Il faut obtenir un vectoriel (SVG) ou un PNG transparent avant de l'utiliser sur un fond coloré.<\u002Fp><\u002Fdiv>\n<div class=\"grid g3\">\n<div class=\"logo-tile\"><div class=\"stage\"><img src=\"5a105841-2464-4c6b-8181-9084629d2d47\" alt=\"Logo Zabantu en couleur\" style=\"width:180px\"><\u002Fdiv><div class=\"cap\"><b>Couleur<\u002Fb> : sur blanc ou fond très clair (bg-page, bg-card). Version par défaut.<\u002Fdiv><\u002Fdiv>\n<div class=\"logo-tile\"><div class=\"stage\" style=\"background:#28382d\"><div style=\"width:180px;height:120px;border:2px dashed #fff;border-radius:12px;display:grid;place-items:center;color:#fff;text-align:center;padding:0.5rem;font-size:0.875rem\">Version blanche à fournir<\u002Fdiv><\u002Fdiv><div class=\"cap\"><b>Blanche<\u002Fb> : sur fond brand, pied de page, bandeau. À dessiner (SVG).<\u002Fdiv><\u002Fdiv>\n<div class=\"logo-tile\"><div class=\"stage\"><div style=\"width:180px;height:120px;border:2px dashed #6d7c6a;border-radius:12px;display:grid;place-items:center;color:#444d42;text-align:center;padding:0.5rem;font-size:0.875rem\">Version monochrome à fournir<\u002Fdiv><\u002Fdiv><div class=\"cap\"><b>Monochrome<\u002Fb> : tampons, impressions en noir, documents officiels. À dessiner (SVG).<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"dos\" style=\"margin-top:1.5rem\">\n<div class=\"panel do\"><b>Faire<\u002Fb><ul><li>Laisser une zone de protection égale à la hauteur de la loupe (environ 12 % de la largeur) tout autour.<\u002Fli><li>Respecter une largeur minimale de 120 px à l'écran et 25 mm à l'impression.<\u002Fli><li>Garder les proportions d'origine.<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"panel dont\"><b>Ne pas faire<\u002Fb><ul><li>Placer le JPEG sur un fond coloré ou une photo : le rectangle blanc se voit.<\u002Fli><li>Recolorer, étirer, incliner ou ajouter une ombre.<\u002Fli><li>Retirer la signature « Economy / Conflict / State » sous 160 px de large sans version réduite validée.<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">10 · Évolution et mode sombre<\u002Fspan><h2>Ajouter sans casser<\u002Fh2><\u002Fdiv>\n<div class=\"grid g2\">\n<div class=\"panel\"><b>Ajouter une couleur<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">1. Créer son échelle --zb-nom-50 à 900 dans :root. 2. Lui donner un rôle sémantique (--zb-color-nom). 3. Vérifier le contraste de chaque paire utilisée. 4. L'ajouter à tokens.json avec le même chemin.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Ajouter un composant<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">Classe préfixée zb-, uniquement des variables --zb-*, états normal, survol, focus, désactivé, erreur, cible de 44 px. Pas de variante réservée à une seule page.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Mode sombre<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">Non livré en v1. Les rôles sémantiques (bg-page, text, border) sont conçus pour être redéfinis sous prefers-color-scheme: dark, mais il faut d'abord obtenir un logo sur fond transparent et revoir les ombres.<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><b>Application mobile<\u002Fb><p class=\"muted\" style=\"margin-top:0.5rem\">tokens.json suit le format W3C Design Tokens : couleurs en hex, tailles en px, durées en ms, courbe en cubic-bezier. Il se transforme en Swift, Kotlin ou Dart avec Style Dictionary.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sg-sec sg-alt\">\n<div class=\"wrap\">\n<div class=\"sg-h\"><span class=\"sg-n\">À faire valider par le client<\u002Fspan><h2>Points ouverts<\u002Fh2><\u002Fdiv>\n<div class=\"panel\"><ol style=\"margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.75rem\">\n<li>Les couleurs de l'orange et du jaune du fruit sont estimées : confirmer sur le fichier source du logo.<\u002Fli>\n<li>Le vert d'action (#3e6b24) est plus sombre que le vert feuille du logo : c'est voulu pour le contraste, à faire accepter.<\u002Fli>\n<li>Obtenir un logo vectoriel (SVG) et un PNG transparent, avec versions blanche et monochrome.<\u002Fli>\n<li>Vérifier le rendu de « ɛ » et « ɔ » avec Source Serif 4 et Source Sans 3 sur les pages réelles, et héberger les polices en local si le réseau est instable à Bamako.<\u002Fli>\n<li>Valider l'ordre et le nombre des six liens de navigation, ainsi que le libellé « Rejoindre Zabantu ».<\u002Fli>\n<li>Décider si le mode sombre est utile avant de le développer.<\u002Fli>\n<li>Valider les icônes : le thème suppose Font Awesome 6 sur le site, la page présente utilise des icônes équivalentes dessinées en SVG.<\u002Fli>\n<\u002Fol><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7600}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
